name: pack

# 手动触发。每次构建发布一个以时间命名的标签（如 20261020-0744），
# 标签下是完整的一套包：没改的包直接从上一个构建带过来，只重打改过的。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 取上一个构建作为底包
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

          if [ -n "$prev" ]; then
            echo "上一个构建: $prev"
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir dist --clobber || true
            if [ -f dist/manifest.json ]; then mv dist/manifest.json .; fi
          else
            echo "还没有任何构建，全量打包"
          fi

      - name: 判断哪些包变了
        id: plan
        run: |
          python3 scripts/pack-plan.py > plan.json
          cat plan.json
          echo "dirs=$(python3 -c 'import json;print(" ".join(json.load(open("plan.json"))["dirs"]))')" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json;print(len(json.load(open("plan.json"))["dirs"]))')" >> "$GITHUB_OUTPUT"

      - name: 重新打包有变化的
        if: steps.plan.outputs.count != '0'
        run: |
          chmod +x pack.sh
          ./pack.sh ${{ steps.plan.outputs.dirs }}

      - name: 放上最新的 amh.sh
        run: cp -f amh.sh dist/amh.sh

      - name: 生成校验和
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum *.tar.gz *.zip *.zip.bf amh.sh 2>/dev/null > SHA256SUMS
          cat SHA256SUMS
          cd ..
          cp dist/SHA256SUMS .

      - name: 生成标签
        id: tag
        run: echo "tag=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: 生成发布说明
        run: |
          PREV="${{ steps.prev.outputs.tag }}"

          if [ -n "$PREV" ]; then
            echo "变更范围: ${PREV}..HEAD"
            git log --no-merges --pretty=format:'- %s' "${PREV}..HEAD" > /tmp/changes.txt || true
            [ -s /tmp/changes.txt ] || echo '- 无代码变更（仅重新构建）' > /tmp/changes.txt
          else
            git log --no-merges --pretty=format:'- %s' -n 10 > /tmp/changes.txt
          fi
          [ -s /tmp/changes.txt ] || echo '- 首次构建' > /tmp/changes.txt

          CHANGED="${{ steps.plan.outputs.dirs }}"
          if [ -z "$CHANGED" ]; then
            CHANGED='无（全部沿用上一个构建）'
          fi

          {
            echo "## 本次变更"
            echo ''
            cat /tmp/changes.txt
            echo
            echo
            echo "## 包"
            echo ''
            echo "- 重新打包：${CHANGED}"
            echo "- 其余包沿用 ${PREV:-无} 的构建"
            echo "- 共 $(ls -1 dist | grep -v -E 'manifest.json|SHA256SUMS' | wc -l) 个文件"
            echo ''
            echo "## 下载"
            echo ''
            echo '```'
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.tag }}/<文件名>"
            echo '```'
            echo ''
            echo '校验：`sha256sum -c SHA256SUMS`'
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "发布标签: $TAG"
          gh release create "$TAG" dist/* manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "AMH 4.5 安装包 $TAG" \
            --notes-file /tmp/notes.md
          echo "---- 上传内容 ----"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "  \(.name)  \(.size)"'
